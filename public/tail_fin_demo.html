<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body { 
    background: #0f172a; 
    color: white; 
    font-family: sans-serif; 
    padding: 60px; 
    display: flex; 
    flex-wrap: wrap; 
    gap: 60px; 
    justify-content: center;
  }
  .tail-card { 
    text-align: center; 
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255,255,255,0.05);
    padding: 24px;
    border-radius: 12px;
    width: 140px;
  }
  .flight-code { 
    margin-top: 16px; 
    font-weight: 800; 
    letter-spacing: 2px;
    font-size: 1.2rem;
  }
  .airline-name {
    font-size: 0.85rem; 
    color: #94a3b8; 
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div style="width: 100%; text-align: center; margin-bottom: 20px;">
    <h2>尾翼デザインのプレビュー (Tail Fin Logo Design Preview)</h2>
  </div>
  <script>
    const airlines = [
      { c: 'NH', n: 'ANA', b: '#003e80', f: '#ffffff', type: 'ana' },
      { c: 'JL', n: 'JAL', b: '#ffffff', f: '#c8102e', type: 'jal' },
      { c: 'UA', n: 'United', b: '#003366', f: '#ffffff', type: 'ua' },
      { c: 'DL', n: 'Delta', b: '#003a70', f: '#e00034', type: 'dl' },
      { c: 'CX', n: 'Cathay', b: '#005e3c', f: '#ffffff', type: 'cx' },
      { c: 'SQ', n: 'Singapore', b: '#002552', f: '#f7c948', type: 'sq' },
      { c: 'KE', n: 'Korean', b: '#00A1DE', f: '#ffffff', type: 'ke' },
      { c: 'CA', n: 'Air China', b: '#ffffff', f: '#d32f2f', type: 'ca' },
      { c: 'TG', n: 'Thai', b: '#4B2582', f: '#FFC72C', type: 'tg' },
      { c: 'QF', n: 'Qantas', b: '#e53935', f: '#ffffff', type: 'qf' }
    ];
    
    // SVG paths based on the requested tail shape (Vertical back, angled front)
    const baseTailPath = "M 10 90 L 80 90 L 80 15 Q 77 10 70 15 L 20 80 Q 15 85 15 90 Z"; // Base silhouette
    const clipPathDef = `<clipPath id="tailClip"><path d="M 10 90 L 80 90 L 80 15 Q 77 10 70 15 L 20 80 Q 15 85 10 90 Z" /></clipPath>`;

    function getDesign(a) {
      if (a.type === 'ana') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><path d="M 20 50 L 80 0 L 80 30 L 0 90 Z" fill="#4B92DB"/><path d="M 30 60 L 80 20 L 80 40 L 10 90 Z" fill="#ffffff"/>`;
      if (a.type === 'jal') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><circle cx="50" cy="50" r="25" fill="${a.f}"/>`;
      if (a.type === 'ua') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><path d="M -10 40 Q 50 -10 110 40" stroke="#f7c948" stroke-width="8" fill="none"/><path d="M -10 60 Q 50 10 110 60" stroke="#ffffff" stroke-width="8" fill="none"/>`;
      if (a.type === 'dl') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><path d="M 50 80 L 70 20 L 80 20 L 60 80 Z" fill="${a.f}"/><path d="M 60 80 L 80 20 L 90 20 L 70 80 Z" fill="#ffffff" opacity="0.8"/>`;
      if (a.type === 'cx') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><path d="M 10 80 Q 50 50 80 10 Q 70 40 40 90 Z" fill="${a.f}"/><rect x="0" y="80" width="100" height="20" fill="#d32f2f"/>`;
      if (a.type === 'sq') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><rect x="0" y="70" width="100" height="30" fill="${a.f}"/><path d="M 20 70 Q 30 40 70 30 Q 50 50 50 70 Z" fill="${a.f}"/>`;
      if (a.type === 'ca') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><circle cx="50" cy="50" r="25" fill="${a.f}"/><path d="M 35 50 L 65 50" stroke="#ffffff" stroke-width="4"/>`;
      if (a.type === 'tg') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><circle cx="50" cy="50" r="20" fill="${a.f}"/><circle cx="50" cy="50" r="25" stroke="#E6007E" stroke-width="4" fill="none"/><rect x="0" y="0" width="100" height="15" fill="#E6007E"/>`;
      if (a.type === 'ke') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><circle cx="50" cy="40" r="25" fill="${a.f}"/><path d="M 25 40 Q 50 20 75 40 Q 50 60 25 40 Z" fill="#d32f2f"/>`;
      if (a.type === 'qf') return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/><path d="M 30 90 Q 50 40 80 20 Q 60 50 60 90 Z" fill="${a.f}"/>`;
      
      return `<rect x="0" y="0" width="100" height="100" fill="${a.b}"/>`;
    }

    airlines.forEach(a => {
      document.write(`
        <div class="tail-card">
          <svg viewBox="0 0 100 100" width="80" height="80" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); outline: 1px solid rgba(255,255,255,0.2);">
            <defs>
              ${clipPathDef}
            </defs>

            <!-- 尾翼の輪郭を描画（背景として抜く） -->
            <path d="${baseTailPath}" fill="#333" />

            <!-- マスクされた領域内にデザインを描画 -->
            <g clip-path="url(#tailClip)">
              ${getDesign(a)}
            </g>
            
            <!-- 輪郭線 -->
            <path d="${baseTailPath}" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>
          </svg>
          <div class="flight-code" style="color: ${a.b === '#ffffff' ? a.f : a.b}">${a.c}</div>
          <div class="airline-name">${a.n}</div>
        </div>
      `);
    });
  </script>
</body>
</html>
