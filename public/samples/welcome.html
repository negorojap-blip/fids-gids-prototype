<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Japan International Airport</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1a3e 50%, #0a0e1a 100%);
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    animation: fadeIn 2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo { font-size: 4rem; margin-bottom: 1rem; }
  .title {
    font-size: 2.5rem;
    font-weight: 700;
    background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .subtitle {
    font-size: 1.3rem;
    font-weight: 300;
    color: rgba(255,255,255,0.6);
    margin-top: 0.5rem;
  }
  .lang-rotate {
    margin-top: 3rem;
    font-size: 1.1rem;
    color: rgba(255,255,255,0.5);
    min-height: 3rem;
  }
  .lang-item {
    opacity: 0;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    transition: opacity 0.8s ease;
  }
  .lang-item.active { opacity: 1; }
  .clock {
    position: fixed;
    top: 2rem;
    right: 3rem;
    font-size: 2rem;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    font-variant-numeric: tabular-nums;
  }
  .decorative-line {
    width: 200px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #fbbf24, transparent);
    margin: 1.5rem auto;
  }
</style>
</head>
<body>
  <div class="clock" id="clock"></div>
  <div class="container">
    <div class="logo">✈</div>
    <div class="title">日本国際空港</div>
    <div class="subtitle">Japan International Airport</div>
    <div class="decorative-line"></div>
    <div class="lang-rotate" style="position:relative;">
      <div class="lang-item active" id="msg0">ようこそ日本国際空港へ — 快適な空の旅をお楽しみください</div>
      <div class="lang-item" id="msg1">Welcome to Japan International Airport — Enjoy your journey</div>
      <div class="lang-item" id="msg2">欢迎来到日本国际机场 — 祝您旅途愉快</div>
      <div class="lang-item" id="msg3">일본 국제공항에 오신 것을 환영합니다</div>
    </div>
  </div>
  <script>
    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Language rotation
    let idx = 0;
    setInterval(() => {
      document.getElementById('msg' + idx).classList.remove('active');
      idx = (idx + 1) % 4;
      document.getElementById('msg' + idx).classList.add('active');
    }, 4000);
  </script>
</body>
</html>
